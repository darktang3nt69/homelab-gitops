---
# =============================================================================
# Jellyfin — ArgoCD Application
# =============================================================================
# Media server with Nvidia GPU transcoding (GTX 1050 Ti).
# RuntimeClass: nvidia — enables NVENC hardware transcoding.
#
# URL: https://jellyfin.k8s.darktang3nt.cloud
# Config: /mnt/data/configs/jellyfin (migrated from docker host)
# Media: /data/library/{movies,tv,music} via shared media-data PVC
# GPU: nvidia.com/gpu: 1 (GTX 1050 Ti, 4GB VRAM)
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellyfin
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/darktang3nt69/homelab-gitops
    targetRevision: main
    path: infrastructure/media/jellyfin
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
