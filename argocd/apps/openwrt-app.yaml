---
# =============================================================================
# OpenWrt Router Monitoring — ArgoCD Application
# =============================================================================
# Applies Service + Endpoints (external target) + ServiceMonitor so
# Prometheus scrapes the router's prometheus-node-exporter-lua endpoint.
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openwrt
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/darktang3nt69/homelab-gitops
    targetRevision: main
    path: infrastructure/openwrt
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
