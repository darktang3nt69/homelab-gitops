---
# =============================================================================
# cert-manager — ArgoCD Application
# =============================================================================
# Installs cert-manager from official Helm chart
# Handles TLS certificate lifecycle — issue, renew, store as k8s Secrets
# Must deploy BEFORE cluster-issuer (which needs cert-manager CRDs)
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.17.2
    helm:
      values: |
        # install CRDs as part of Helm chart
        # Why: ensures CRDs exist before any Certificate/Issuer resources
        crds:
          enabled: true

        # single control-plane node (thor), no real cross-node HA anyway —
        # power cuts take both nodes together, so 2 replicas bought nothing.
        # controller is reconcile-only (renewals), safe to run 1.
        replicaCount: 1

        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            # bumped from 128Mi: controller got memcg OOM-killed repeatedly
            # (anon-rss sat right at the limit) — 488 restarts across
            # controller+cainjector pods, seen 2026-09-05
            cpu: 200m
            memory: 256Mi

        cainjector:
          replicaCount: 1
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              # bumped from 128Mi, same OOM as controller above
              cpu: 100m
              memory: 256Mi

        webhook:
          replicaCount: 2
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        app.kubernetes.io/component: webhook
                        app.kubernetes.io/instance: cert-manager
                    topologyKey: kubernetes.io/hostname
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi

        # enable prometheus metrics scraping
        prometheus:
          enabled: true
          servicemonitor:
            enabled: false   # enable when monitoring stack is deployed
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
# =============================================================================
# cert-manager Config — ArgoCD Application
# =============================================================================
# Applies ClusterIssuer + wildcard Certificate
# Must deploy AFTER cert-manager (needs CRDs + controller running)
# Uses DNS-01 challenge via Cloudflare API
# Why DNS-01: server doesn't need to be publicly reachable
#             works for internal services accessed via Twingate
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/darktang3nt69/homelab-gitops
    targetRevision: main
    path: infrastructure/cert-manager
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
