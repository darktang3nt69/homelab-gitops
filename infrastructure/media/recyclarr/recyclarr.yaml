---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recyclarr
  namespace: media
  labels:
    app.kubernetes.io/name: recyclarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: recyclarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recyclarr
    spec:
      nodeSelector:
        kubernetes.io/hostname: thor
      securityContext:
        fsGroup: 568
      containers:
        - name: recyclarr
          image: ghcr.io/recyclarr/recyclarr:7.4.0
          env:
            - name: PUID
              value: "568"
            - name: PGID
              value: "568"
            - name: TZ
              value: "Asia/Kolkata"
            - name: CRON_SCHEDULE
              value: "@daily"
          volumeMounts:
            - name: config
              mountPath: /config
              subPath: recyclarr-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - NET_RAW
                - NET_ADMIN
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: media-configs
