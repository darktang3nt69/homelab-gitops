---
# ── Namespace ────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: affine
---
# ── Postgres PVC (Longhorn) ───────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: affine-postgres
  namespace: affine
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
# ── Redis PVC (Longhorn) ──────────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: affine-redis
  namespace: affine
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
# ── Postgres ──────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: affine-postgres
  namespace: affine
  labels:
    app.kubernetes.io/name: affine-postgres
spec:
  serviceName: affine-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: affine-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: affine-postgres
    spec:
      nodeSelector:
        kubernetes.io/hostname: thor
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: affine-secret
                  key: db-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: affine-secret
                  key: db-password
            - name: POSTGRES_DB
              value: affine
            - name: POSTGRES_INITDB_ARGS
              value: "--data-checksums"
            - name: POSTGRES_HOST_AUTH_METHOD
              value: trust
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 999
            runAsGroup: 999
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "affine", "-d", "affine"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "affine", "-d", "affine"]
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: affine-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: affine-postgres
  namespace: affine
spec:
  selector:
    app.kubernetes.io/name: affine-postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
---
# ── Redis ─────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: affine-redis
  namespace: affine
  labels:
    app.kubernetes.io/name: affine-redis
spec:
  serviceName: affine-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: affine-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: affine-redis
    spec:
      nodeSelector:
        kubernetes.io/hostname: thor
      securityContext:
        fsGroup: 999
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--appendonly", "yes", "--dir", "/data"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 999
            runAsGroup: 999
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: affine-redis
---
apiVersion: v1
kind: Service
metadata:
  name: affine-redis
  namespace: affine
spec:
  selector:
    app.kubernetes.io/name: affine-redis
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP
---
# ── AFFiNE Migration Job ──────────────────────────────────────────────────────
apiVersion: batch/v1
kind: Job
metadata:
  name: affine-migration
  namespace: affine
spec:
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-postgres
          image: busybox:1.37
          command:
            - sh
            - -c
            - until nc -z affine-postgres 5432; do sleep 2; done
          securityContext:
            runAsUser: 1000
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: migration
          image: ghcr.io/toeverything/affine:0.25.7
          command: ["sh", "-c", "node ./scripts/self-host-predeploy.js"]
          env:
            - name: REDIS_SERVER_HOST
              value: affine-redis
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: affine-secret
                  key: database-url
            - name: AFFINE_INDEXER_ENABLED
              value: "false"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
# ── AFFiNE App ────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: affine
  namespace: affine
  labels:
    app.kubernetes.io/name: affine
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: affine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: affine
    spec:
      nodeSelector:
        kubernetes.io/hostname: thor
      initContainers:
        - name: wait-postgres
          image: busybox:1.37
          command:
            - sh
            - -c
            - until nc -z affine-postgres 5432; do sleep 2; done
          securityContext:
            runAsUser: 1000
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: affine
          image: ghcr.io/toeverything/affine:0.25.7
          env:
            - name: REDIS_SERVER_HOST
              value: affine-redis
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: affine-secret
                  key: database-url
            - name: AFFINE_SERVER_HTTPS
              value: "true"
            - name: AFFINE_SERVER_EXTERNAL_URL
              value: "https://affine.k8s.darktang3nt.cloud"
            - name: AFFINE_INDEXER_ENABLED
              value: "false"
            - name: NODE_ENV
              value: production
          ports:
            - name: webui
              containerPort: 3010
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 3010
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 3010
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: affine
  namespace: affine
  labels:
    app.kubernetes.io/name: affine
spec:
  selector:
    app.kubernetes.io/name: affine
  ports:
    - name: webui
      port: 3010
      targetPort: 3010
  type: ClusterIP
---
# ── HTTPRoute ─────────────────────────────────────────────────────────────────
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: affine
  namespace: affine
  labels:
    app.kubernetes.io/name: affine
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - "affine.k8s.darktang3nt.cloud"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: affine
          port: 3010
          group: ""
          kind: Service
