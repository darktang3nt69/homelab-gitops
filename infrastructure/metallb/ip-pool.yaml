---
# =============================================================================
# MetalLB IP Address Pool
# =============================================================================
# Pool range: 192.168.2.150 - 192.168.2.220
# These IPs must be outside your router DHCP range
# (OpenWrt hands out 192.168.2.100-149, so this pool sits safely above it)
#
# Reserved allocations:
#   192.168.2.200 → Envoy Gateway (fixed)
#                   *.darktang3nt.cloud A record points here
#                   All Twingate-accessed services route through this IP
#   192.168.2.201 → Promtail syslog receiver (OpenWrt remote logging target)
#   192.168.2.202 → AdGuard Home primary (hephaestus, DNS advertised via DHCP)
#   192.168.2.203 → AdGuard Home secondary (thor, independent instance for failover)
# =============================================================================
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: homelab-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.2.150-192.168.2.220
---
# =============================================================================
# MetalLB L2 Advertisement
# =============================================================================
# Uses ARP to announce IPs from homelab-pool
# When a pod needs a LoadBalancer IP, MetalLB responds to ARP requests
# from LAN for that IP — no BGP, no special router config needed
# =============================================================================
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: homelab-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - homelab-pool
