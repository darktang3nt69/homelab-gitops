---
# =============================================================================
# Alertmanager Global Config — routes everything to Discord
# =============================================================================
# Referenced as the root config via alertmanager.alertmanagerSpec.
# alertmanagerConfiguration.name in kube-prometheus-stack-app.yaml.
#
# Watchdog (the synthetic always-firing alert that verifies the pipeline
# itself is alive) stays suppressed — it's a heartbeat check, not something
# to page on. Everything else — built-in k8s health alerts, the OpenWrt
# router alerts — goes to Discord.
#
# discord-webhook secret created manually (not in git):
#   kubectl create secret generic discord-webhook -n monitoring \
#     --from-literal=url=<discord-webhook-url>
# =============================================================================
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: alertmanager-global-config
  namespace: monitoring
spec:
  route:
    receiver: discord
    groupBy: [namespace]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 12h
    routes:
      - receiver: "null"
        matchers:
          - name: alertname
            value: Watchdog
            matchType: "="
  inhibitRules:
    - sourceMatch:
        - name: severity
          value: critical
          matchType: "="
      targetMatch:
        - name: severity
          value: warning|info
          matchType: "=~"
      equal: [namespace, alertname]
    - sourceMatch:
        - name: alertname
          value: InfoInhibitor
          matchType: "="
      targetMatch:
        - name: severity
          value: info
          matchType: "="
      equal: [namespace]
  receivers:
    - name: "null"
    - name: discord
      discordConfigs:
        - apiURL:
            name: discord-webhook
            key: url
          sendResolved: true
