---
# =============================================================================
# OpenWrt Router — ServiceMonitor
# =============================================================================
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: openwrt-router
  namespace: monitoring
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: openwrt-router
  namespaceSelector:
    matchNames:
      - monitoring
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
