---
# =============================================================================
# OpenWrt Router — Automated Config Backup
# =============================================================================
# Nightly: SSH into the router, take a fresh sysupgrade config backup,
# pull it, upload to MinIO (bucket: openwrt-backups).
#
# Retention is handled server-side via a MinIO bucket lifecycle rule
# (30-day expiration, set once at bucket creation) rather than scripted
# here — this MinIO version denies ListBucket to non-root IAM users
# regardless of policy (confirmed: even a full s3:* grant still denies
# listing, while root lists fine), so a list-then-prune loop can't work.
# Server-side expiration sidesteps it entirely and needs no listing.
#
# Uses a dedicated SSH key (openwrt-backup-ssh-key) and scoped MinIO
# credentials (openwrt-backup-minio-credentials, PutObject-only) — see
# BACKUP-SECRETS-SETUP.md for why these are separate from the admin key
# / MinIO root credentials.
# =============================================================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openwrt-backup
  namespace: monitoring
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 0
  jobTemplate:
    spec:
      backoffLimit: 2
      # a wedged apk/ssh/mc step has no built-in timeout and, combined with
      # concurrencyPolicy: Forbid, can block every future run indefinitely —
      # seen 2026-08-30 (job ran 8h before being killed manually)
      activeDeadlineSeconds: 900
      template:
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: thor
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              effect: NoSchedule
              operator: Exists
          containers:
            - name: backup
              image: alpine:3.20
              env:
                - name: MINIO_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: openwrt-backup-minio-credentials
                      key: access-key
                - name: MINIO_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: openwrt-backup-minio-credentials
                      key: secret-key
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  apk update >/dev/null
                  apk add --no-cache openssh-client curl >/dev/null

                  curl -sSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc
                  chmod +x /usr/local/bin/mc

                  mkdir -p ~/.ssh
                  cp /keys/id_ed25519 ~/.ssh/id_ed25519
                  chmod 600 ~/.ssh/id_ed25519
                  ssh-keyscan -H 192.168.2.1 >> ~/.ssh/known_hosts 2>/dev/null

                  FNAME="openwrt-backup-$(date -u +%Y%m%d-%H%M%S).tar.gz"
                  SSH="ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no root@192.168.2.1"

                  $SSH "sysupgrade -b /tmp/$FNAME"
                  # OpenWrt's dropbear has no sftp-server, so scp (which defaults to
                  # SFTP) can't be used — pull the file over a plain SSH pipe instead.
                  $SSH "cat /tmp/$FNAME" > "/tmp/$FNAME"
                  $SSH "rm -f /tmp/$FNAME"

                  mc alias set openwrt http://minio.storage:9000 "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY"
                  mc cp "/tmp/$FNAME" "openwrt/openwrt-backups/$FNAME"
                  echo "uploaded $FNAME"
              volumeMounts:
                - name: ssh-key
                  mountPath: /keys
                  readOnly: true
              resources:
                requests:
                  cpu: 25m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
          volumes:
            - name: ssh-key
              secret:
                secretName: openwrt-backup-ssh-key
                defaultMode: 0400
